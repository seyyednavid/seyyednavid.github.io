# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Navid Hejazi
description: "I’m a Full-Stack Developer with commercial experience building Python applications, real-time software–hardware integrations, and systems used by real customers.

Alongside my professional work, I build AI applications focused on Retrieval-Augmented Generation (RAG), agentic workflows, and intelligent automation. My portfolio includes a multi-agent software engineering platform deployed on AWS, an Advanced RAG system with hybrid retrieval and evaluation, and end-to-end AI automation workflows.

I’m currently seeking Junior AI Engineer, AI Application Developer, and Agentic AI Developer opportunities where I can combine practical software engineering experience with applied AI.
"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Full-Stack Developer Building AI-Powered Applications
 <span style="color:#f58506"> Portfolio </span>
location: "London, UK"
resume_url: /docs/NavidHejazi-CV-June.pdf
avatar_image: /img/profile_picture.jpg

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/navid-hejazi/#" # Add your linkedln handle
github: "https://github.com/seyyednavid/#"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


